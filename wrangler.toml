name = "gold-price-worker"
main = "src/index.js"
compatibility_date = "2024-03-09"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "PRICE_STORAGE"
id = "bb4cd6eaa6c94a3d94f586c08c93cd95"
